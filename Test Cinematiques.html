<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test des cinématiques RoxPy</title>
<style>
  body{margin:0;background:#0d1424;color:#f0e8dc;font-family:system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  header{padding:14px 20px;border-bottom:1px solid rgba(246,183,60,.25);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  .now{font-weight:800;color:#F6B73C}
  .stage{flex:1;display:grid;place-items:center;background:#000;position:relative}
  video{width:100%;height:100%;max-height:78vh;object-fit:contain;background:#000}
  .status{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:8px;font-size:13px}
  .bar{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid rgba(246,183,60,.25)}
  button{padding:11px 18px;border-radius:10px;border:none;font-size:14px;font-weight:800;cursor:pointer}
  .prev{background:#2a3550;color:#dce3ea}
  .next{background:linear-gradient(135deg,#FF7A00,#F6B73C);color:#1a130b}
  .grid{display:flex;gap:6px;flex-wrap:wrap}
  .grid button{padding:7px 11px;font-size:12px;background:#1a2540;color:#9fb0c8;border:1px solid rgba(255,255,255,.12)}
  .grid button.ok{border-color:#57b06a;color:#8fe0a0}
  .grid button.ko{border-color:#e05a5a;color:#f2a0a0}
  .grid button.cur{background:#F6B73C;color:#1a130b}
</style>
</head>
<body>
<header>
  <h1>🎬 Test des 19 cinématiques</h1>
  <span>En cours : <span class="now" id="now">—</span></span>
  <span id="size" style="font-size:12px;color:#9fb0c8"></span>
</header>
<div class="stage">
  <div class="status" id="status">Prête</div>
  <video id="v" controls autoplay playsinline preload="auto"></video>
</div>
<div class="bar">
  <button class="prev" id="prev">◀ Précédente</button>
  <button class="next" id="next">Suivante ▶</button>
  <div class="grid" id="grid"></div>
</div>
<script>
  const order = [1,3,4,7,8,10,2,5,6,9,11,12,13,14,15,16,17,18,19];
  const vids = order.map(n => n+'.mp4');
  const v = document.getElementById('v');
  const now = document.getElementById('now');
  const status = document.getElementById('status');
  const sizeEl = document.getElementById('size');
  const grid = document.getElementById('grid');
  let i = 0;
  const btns = vids.map((name, idx) => {
    const b = document.createElement('button');
    b.textContent = order[idx];
    b.onclick = () => load(idx);
    grid.appendChild(b);
    return b;
  });
  async function checkSize(url){
    try{
      const r = await fetch(url, {method:'HEAD'});
      if(!r.ok){ sizeEl.textContent='⚠️ HTTP '+r.status+' (fichier introuvable)'; btns[i].className='ko cur'; return; }
      const len = r.headers.get('content-length');
      sizeEl.textContent = len ? '📦 '+(len/1024/1024).toFixed(1)+' Mo' : '';
    }catch(e){ sizeEl.textContent='⚠️ '+e.message; }
  }
  function load(idx){
    i = idx;
    const name = vids[i];
    now.textContent = name;
    status.textContent = 'Chargement…';
    btns.forEach((b,k)=>{ b.classList.remove('cur'); if(k===i) b.classList.add('cur'); });
    sizeEl.textContent='';
    v.src = 'assets/video/' + name;
    v.load();
    checkSize(v.src);
    v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
  }
  v.addEventListener('playing', ()=>{ status.textContent='▶ Lecture'; btns[i].classList.add('ok'); });
  v.addEventListener('error', ()=>{ status.textContent='❌ Échec de chargement'; btns[i].classList.add('ko'); });
  v.addEventListener('ended', ()=>{ if(i<vids.length-1) load(i+1); else status.textContent='✅ Fin'; });
  document.getElementById('next').onclick = ()=> load(Math.min(i+1, vids.length-1));
  document.getElementById('prev').onclick = ()=> load(Math.max(i-1, 0));
  load(0);
</script>
</body>
</html>
